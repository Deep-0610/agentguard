name: CI

on:
  push:
    branches: [main, "hardening/**", "security/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go security and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Format Go sources
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Fuzz redaction
        run: go test ./internal/scanner -run=^$ -fuzz=FuzzRedactNeverRetainsNonEmptyInput -fuzztime=10s -parallel=2
      - name: Fuzz sensitive environment analysis
        run: go test ./internal/scanner -run=^$ -fuzz=FuzzAnalyzeSensitiveEnvironmentValues -fuzztime=10s -parallel=2
      - name: Build
        run: go build ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
