name: CI

on:
  push:
    branches: [main, "hardening/**", "security/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go security and quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Normalize Go formatting before analysis
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Unit and race tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Fuzz redaction
        run: go test ./internal/scanner -run=^$ -fuzz=FuzzRedactNeverRetainsNonEmptyInput -fuzztime=8s -parallel=2
      - name: Fuzz sensitive environment analysis
        run: go test ./internal/scanner -run=^$ -fuzz=FuzzAnalyzeSensitiveEnvironmentValues -fuzztime=8s -parallel=2
      - name: Fuzz JSON validation
        run: go test ./internal/discovery -run=^$ -fuzz=FuzzValidateJSON -fuzztime=8s -parallel=2
      - name: Build
        run: go build ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
